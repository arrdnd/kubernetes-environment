apiVersion: batch/v1
kind: Job
metadata:
  name: job-name
spec:
  completions: 2
  parallelism: 1
  template:
    metadata:
      labels:
        key1: value1
    spec:
      containers:
        - name: container-name
          image: busybox
          command: ["sh", "-c", "echo Hello"]
      restartPolicy: Never
